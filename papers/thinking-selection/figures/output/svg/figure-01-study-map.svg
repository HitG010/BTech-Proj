 <title>Study and evidence map</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Study and evidence map</dc:title>
    <dc:description>Figure 1. Study and evidence map. The primary learner, later controls, and post-hoc same-question diagnostics reuse 50 question groups. The separate two-solver panel has 64 groups; the cap cohort contains 11 of those same questions. The fresh guard panel uses 228 questions disjoint from development and evaluates a policy contrast with a common cutoff refitted on all 128 development states and frozen before fresh collection. Dashed arrows show design influence, not independent replication or pooled evidence. Boxes are not proportional to sample size.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Frozen report-only R5 Matplotlib export</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
